<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>e2e.network — Авторизация</title>
    <style>
        @font-face {
            font-family: 'Manrope';
            src: local('Manrope Regular'), url('./Manrope-Regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Manrope';
            src: local('Manrope Medium'), url('./Manrope-Medium.woff2') format('woff2');
            font-weight: 500;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Manrope';
            src: local('Manrope SemiBold'), url('./Manrope-SemiBold.woff2') format('woff2');
            font-weight: 600;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Manrope';
            src: local('Manrope Bold'), url('./Manrope-Bold.woff2') format('woff2');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        :root {
            /* Строгая палитра "clean tech" */
            --bg-base: #0b0b0d;
            --bg-surface: #151518;
            --bg-hover: #1c1c20;
            --accent: #da4a44;
            --accent-hover: #e35650;
            --accent-dark: #8b2b28;
            --accent-soft: rgba(218, 74, 68, 0.12);
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --border: #2c2c30;
            --border-hover: #3a3a40;

            --radius-elem: 14px;
            --ios-ease: cubic-bezier(0.3, 0, 0.1, 1);
            --font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        ::selection { background-color: var(--accent); color: #ffffff; }
        ::-moz-selection { background-color: var(--accent); color: #ffffff; }

        html, body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: var(--font-family);
            color-scheme: dark;
            min-height: 100vh;
            width: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            position: relative;
            user-select: none;
        }

        body.loading { overflow: hidden; }

        input {
            user-select: auto;
            color-scheme: dark;
            font-family: var(--font-family);
            color: var(--text-main);
            -webkit-text-fill-color: var(--text-main);
            caret-color: var(--accent) !important;
        }

        #preloader {
            position: fixed;
            inset: 0;
            background-color: var(--bg-base);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0;
            transition: opacity 0.5s var(--ios-ease), visibility 0.5s var(--ios-ease);
        }

        #preloader.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .lava-spinner {
            width: 36px;
            height: 36px;
            animation: rotateLava 1.5s linear infinite;
        }

        .lava-spinner circle {
            stroke-dasharray: 90, 150;
            stroke-dashoffset: 0;
            animation: dashLava 1.5s ease-in-out infinite;
        }

        @keyframes rotateLava { 100% { transform: rotate(360deg); } }
        @keyframes dashLava {
            0% { stroke-dasharray: 1, 150; stroke-dashoffset: 0; }
            50% { stroke-dasharray: 90, 150; stroke-dashoffset: -35; }
            100% { stroke-dasharray: 90, 150; stroke-dashoffset: -124; }
        }

        .auth-container {
            width: 100%;
            max-width: 400px;
            padding: 8vh 24px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
            animation: fadeUp 0.6s var(--ios-ease) forwards;
            opacity: 0;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .lang-toggle {
            position: absolute;
            top: 24px;
            right: 24px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            border-radius: 12px;
            padding: 8px 12px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s var(--ios-ease);
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .lang-toggle:hover { color: var(--text-main); background: var(--bg-surface); }
        .lang-toggle:active { transform: scale(0.96); }
        .lang-toggle svg { width: 16px; height: 16px; opacity: 0.8; }

        .logo-area svg { width: 88px; height: 88px; }

        .auth-header {
            text-align: center;
            margin-bottom: 32px;
            width: 100%;
        }

        .auth-header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 10px;
        }

        .auth-header p {
            font-size: 15px;
            color: var(--text-muted);
            line-height: 1.4;
            max-width: 340px;
            margin: 0 auto;
            min-height: 42px;
        }

        .reset-info-box {
            background: var(--bg-base);
            border: 1px solid var(--accent);
            box-shadow: 0 0 0 1px var(--accent);
            border-radius: var(--radius-elem);
            padding: 12px 16px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .reset-info-icon-wrap {
            width: 32px;
            height: 32px;
            background: var(--bg-surface);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            flex-shrink: 0;
        }

        .reset-info-text { font-size: 14px; color: var(--text-muted); line-height: 1.4; flex: 1; }
        .reset-info-text span { color: var(--text-main); font-weight: 600; overflow-wrap: anywhere; word-break: break-word; white-space: normal; }

        .auth-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .input-group {
            position: relative;
            width: 100%;
            --current-border: var(--border);
            --current-label: var(--text-muted);
        }

        .input-group:hover { --current-border: var(--accent-dark); --current-label: var(--accent-dark); }
        .input-group:focus-within, .input-group.open { --current-border: var(--accent); --current-label: var(--accent); }
        .input-group.invalid { --current-border: var(--accent) !important; --current-label: var(--accent) !important; animation: shake 0.4s var(--ios-ease); }

        .input-field {
            width: 100%;
            background: var(--bg-base);
            border: 1px solid var(--current-border) !important;
            border-radius: var(--radius-elem);
            padding: 18px 16px;
            color: var(--text-main);
            -webkit-text-fill-color: var(--text-main);
            font-family: var(--font-family);
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s var(--ios-ease), box-shadow 0.2s var(--ios-ease);
            appearance: none;
            background-clip: padding-box;
            box-shadow: 0 0 0 1000px var(--bg-base) inset, 0 0 0 1px var(--current-border) !important;
            height: 54px;
        }

        .input-field.has-icon { padding-right: 48px; }

        input:-webkit-autofill, input:-webkit-autofill:hover, input:-webkit-autofill:focus, input:-webkit-autofill:active {
            -webkit-text-fill-color: var(--text-main) !important;
            color: var(--text-main) !important;
            caret-color: var(--accent) !important;
            font-family: var(--font-family) !important;
            text-shadow: 0 0 0 var(--text-main) !important;
            border: 1px solid var(--current-border) !important;
            -webkit-box-shadow: 0 0 0 1000px var(--bg-base) inset, 0 0 0 1px var(--current-border) !important;
            box-shadow: 0 0 0 1000px var(--bg-base) inset, 0 0 0 1px var(--current-border) !important;
            transition: background-color 999999s ease-out 0s, color 999999s ease-out 0s !important;
        }

        .input-label {
            position: absolute;
            left: 12px;
            top: 17px;
            color: var(--current-label) !important;
            font-size: 16px;
            pointer-events: none;
            background: var(--bg-base);
            padding: 0 4px;
            transform-origin: left top;
            transition: transform 0.2s var(--ios-ease), color 0.2s var(--ios-ease), left 0.2s var(--ios-ease), background-color 0.2s var(--ios-ease);
        }

        .input-field:focus ~ .input-label, .input-field:not(:placeholder-shown) ~ .input-label, .input-group.open .input-label {
            transform: translateY(-26px) scale(0.85);
        }

        .input-icon-btn {
            position: absolute;
            right: 8px;
            top: 27px;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.2s;
        }

        .input-icon-btn:hover { color: var(--text-main); }
        .chevron-icon { pointer-events: none; transition: transform 0.25s var(--ios-ease); }
        .input-group.open .chevron-icon { transform: rotate(180deg); }

        .error-text { color: var(--accent); font-size: 13px; margin-top: 6px; margin-left: 16px; display: none; }
        .input-group.invalid .error-text { display: block; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-4px); }
            40%, 80% { transform: translateX(4px); }
        }

        .dropdown-menu {
            position: absolute;
            top: calc(54px + 8px);
            left: 0;
            width: 100%;
            background: var(--bg-surface);
            border: 2px solid var(--border-hover);
            border-radius: var(--radius-elem);
            overflow: hidden;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.2s var(--ios-ease);
            z-index: 100;
        }

        .input-group.open .dropdown-menu { opacity: 1; visibility: visible; transform: translateY(0); }
        .dropdown-header { padding: 16px 16px 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); font-weight: 700; }
        .dropdown-item { padding: 14px 16px; font-size: 15px; color: var(--text-main); cursor: pointer; border-bottom: 1px solid var(--border); transition: background 0.1s ease, border-color 0.1s ease; display: flex; flex-direction: column; gap: 2px; }
        .dropdown-item small { font-size: 13px; color: var(--text-muted); }
        .dropdown-item:last-child { border-bottom: none; }
        .dropdown-item:hover { background: var(--bg-hover); }

        @media (max-width: 1125px) {
            .dropdown-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 12px 16px 12px; }
            .dropdown-header { grid-column: 1 / -1; padding: 16px 4px 8px; border-bottom: none; }
            .dropdown-item { flex-direction: row; align-items: center; justify-content: center; text-align: center; padding: 12px 8px; border: 1px solid var(--border); border-radius: 10px; background: rgba(255, 255, 255, 0.02); font-size: 14px; font-weight: 500; }
            .dropdown-item:hover { border-color: var(--accent); background: var(--bg-hover); }
            .dropdown-item small { display: none; }
            .dropdown-item:last-child { border-bottom: 1px solid var(--border); }

            .lang-modal-overlay { align-items: flex-end !important; }
            .lang-modal { max-width: 100% !important; border-radius: 20px 20px 0 0 !important; border-bottom: none !important; border-left: none !important; border-right: none !important; }
        }

        @media (min-width: 1126px) {
            .dropdown-menu { top: -10px; left: calc(100% + 20px); width: 280px; height: auto; max-height: 420px; transform: translateX(-15px); display: flex; flex-direction: column; }
            .input-group.open .dropdown-menu { transform: translateX(0); }
            .input-group .chevron-icon { transform: rotate(-90deg); }
            .input-group.open .chevron-icon { transform: rotate(90deg); }

            .lang-modal-overlay { position: fixed; inset: 0; background: transparent !important; pointer-events: none; display: block; }
            .lang-modal-overlay.active { pointer-events: none; }
            .lang-modal { position: absolute; top: 24px; left: calc(50% + 220px); width: 280px; height: 464px; margin: 0; max-width: none; border: 2px solid var(--border-hover); border-radius: var(--radius-elem); box-shadow: 0 20px 40px rgba(0,0,0,0.6); pointer-events: auto; }
            .lang-list { height: calc(100% - 73px); flex-grow: 1; }
            .lang-close-btn { display: none !important; }
        }

        .forgot-pass-container { display: flex; justify-content: flex-end; margin-top: -4px; margin-bottom: 4px; }
        .forgot-pass-link { color: var(--accent); font-size: 14px; text-decoration: none; font-weight: 500; transition: opacity 0.2s; }
        .forgot-pass-link:hover { opacity: 0.8; }

        .actions-wrapper { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; width: 100%; }
        .primary-btn, .secondary-btn { width: 100%; height: 54px; border: none; border-radius: var(--radius-elem); font-family: var(--font-family); font-size: 15px; font-weight: 600; letter-spacing: 0.02em; cursor: pointer; transition: background 0.2s ease, transform 0.1s ease; display: flex; align-items: center; justify-content: center; text-transform: uppercase; }
        .btn-icon { display: flex; align-items: center; justify-content: center; margin-right: 8px; }
        .btn-icon svg { width: 20px; height: 20px; fill: currentColor; }
        .primary-btn { background: var(--accent); color: #ffffff; }
        .primary-btn:hover { background: var(--accent-hover); }
        .primary-btn:active { transform: scale(0.98); }
        .secondary-btn { background: var(--accent-soft); color: var(--accent); }
        .secondary-btn:hover { background: rgba(218, 74, 68, 0.18); }
        .secondary-btn:active { transform: scale(0.98); }
        .spinner { display: none; width: 22px; height: 22px; border: 2px solid rgba(255, 255, 255, 0.3); border-top-color: #ffffff; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hidden { display: none !important; }

        /* --- АНИМАЦИЯ ЯЗЫКОВ СЛЕВА НАПРАВО ДЛЯ ВСЕХ УСТРОЙСТВ --- */
        .lang-modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); z-index: 1000; display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: opacity 0.25s ease, visibility 0.25s ease; }
        .lang-modal-overlay.active { opacity: 1; visibility: visible; }

        .lang-modal {
            width: 100%;
            max-width: 340px;
            background: var(--bg-surface);
            border: 2px solid var(--border-hover);
            border-radius: var(--radius-elem);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: none;
            /* Выплывает слева */
            transform: translateX(-20px);
            opacity: 0;
            transition: transform 0.25s var(--ios-ease), opacity 0.25s var(--ios-ease);
        }
        .lang-modal-overlay.active .lang-modal {
            transform: translateX(0) !important;
            opacity: 1;
        }

        .lang-modal-header { padding: 16px 14px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; background: var(--bg-surface); }
        .search-field { background-color: var(--bg-surface) !important; padding-left: 44px !important; box-shadow: 0 0 0 1000px var(--bg-surface) inset, 0 0 0 1px var(--current-border) !important; }
        .search-label { left: 44px !important; background-color: transparent !important; }
        .search-field:focus ~ .search-label, .search-field:not(:placeholder-shown) ~ .search-label { left: 12px !important; background-color: var(--bg-surface) !important; }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; transition: color 0.2s var(--ios-ease); z-index: 2; }
        .search-field:focus ~ .search-icon { color: var(--accent); }
        .lang-close-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; width: 38px; height: 38px; flex-shrink: 0; border-radius: 10px; display: flex; align-items: center; justify-content: center; transition: all 0.2s var(--ios-ease); margin-top: -4px; }
        .lang-close-btn:hover { background: var(--bg-hover); color: var(--text-main); }

        .lang-list { height: 320px; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 4px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
        .lang-list::-webkit-scrollbar { width: 6px; }
        .lang-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        .lang-item { padding: 12px 16px; font-size: 15px; color: var(--text-main); cursor: pointer; transition: background 0.15s, color 0.15s; display: flex; align-items: center; justify-content: space-between; border-radius: 10px; border: none; }
        .lang-item:hover { background: var(--bg-hover); }
        .lang-item.selected { color: var(--accent); font-weight: 600; background: var(--accent-soft); }
        .lang-item.selected:hover { background: rgba(218, 74, 68, 0.18); }
        .lang-item.selected svg { color: var(--accent); flex-shrink: 0; }
        .lang-empty { height: 100%; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--text-muted); font-size: 15px; }

    </style>
</head>
<body class="loading">

    <div id="preloader">
        <svg class="lava-spinner" viewBox="0 0 50 50">
            <defs>
                <linearGradient id="lavaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ff512f" />
                    <stop offset="100%" stop-color="#da4a44" />
                </linearGradient>
            </defs>
            <circle cx="25" cy="25" r="20" fill="none" stroke="url(#lavaGrad)" stroke-width="4" stroke-linecap="round" />
        </svg>
    </div>

    <div class="lang-modal-overlay" id="langModalOverlay" onclick="closeLangModalMobile(event)">
        <div class="lang-modal" id="langModal" onclick="event.stopPropagation()">
            <div class="lang-modal-header">
                <div class="input-group" style="flex: 1; margin-bottom: 0;">
                    <input type="text" id="langSearch" class="input-field search-field" placeholder=" " oninput="filterLanguages()">
                    <label class="input-label search-label" id="lblSearchPlace">Поиск языка...</label>
                    <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </div>
                <button class="lang-close-btn" onclick="closeLangModalBtn()">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="lang-list" id="langList">
                </div>
        </div>
    </div>

    <div class="auth-container">
        <button class="lang-toggle" onclick="openLangModal()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
            </svg>
            <span id="currentLangBtnText">English</span>
        </button>

        <div class="logo-area">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
              <defs>
                <linearGradient id="brandGradient" x1="10%" y1="0%" x2="90%" y2="100%">
                  <stop offset="0%" stop-color="#fd6977" />
                  <stop offset="100%" stop-color="#da2231" />
                </linearGradient>
              </defs>
              <path fill="url(#brandGradient)" d="M 90 40 C 50 15, 20 60, 30 100 C 35 140, 60 180, 95 160 C 115 148, 105 125, 88 120 C 70 112, 70 88, 88 80 C 105 75, 115 52, 90 40 Z" />
              <path fill="url(#brandGradient)" d="M 118 48 C 128 52, 142 52, 152 48 C 148 60, 148 76, 152 88 C 142 84, 128 84, 118 88 C 122 76, 122 60, 118 48 Z" />
              <path fill="url(#brandGradient)" d="M 118 112 C 128 116, 142 116, 152 112 C 148 124, 148 140, 152 152 C 142 148, 128 148, 118 152 C 122 140, 122 124, 118 112 Z" />
            </svg>
        </div>

        <div class="auth-header">
            <h1>e2e.network</h1>
            <p id="headerSubtitle">Укажите свой homeserver и введите данные для входа.</p>
        </div>

        <form class="auth-form" id="authForm" novalidate onsubmit="handleAuth(event)">

            <div class="input-group" id="hsGroup">
                <input type="text" id="homeserver" class="input-field has-icon" placeholder=" " value="" autocomplete="off" onfocus="openDropdown()" oninput="handleInput(this)">
                <label class="input-label" id="lblHomeserver">Homeserver (напр. matrix.org)</label>
                <button type="button" class="input-icon-btn" onclick="toggleDropdown(event)" tabindex="-1">
                    <svg class="chevron-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>

                <div class="dropdown-menu" id="hsMenu">
                    <div class="dropdown-header" id="txtPopularServers">Популярные серверы</div>
                    <div class="dropdown-item" onclick="selectServer('matrix.org')">matrix.org<small>Публичная сеть Matrix</small></div>
                    <div class="dropdown-item" onclick="selectServer('mozilla.org')">mozilla.org<small>Mozilla Foundation</small></div>
                    <div class="dropdown-item" onclick="selectServer('kde.org')">kde.org<small>KDE Community</small></div>
                    <div class="dropdown-item" onclick="selectServer('tchncs.de')">tchncs.de<small>Tech & Privacy</small></div>
                    <div class="dropdown-item" onclick="selectServer('ubuntu.com')">ubuntu.com<small>Ubuntu Community</small></div>
                </div>
                <div class="error-text"></div>
            </div>

            <div class="reset-info-box hidden" id="resetInfoBox">
                <div class="reset-info-icon-wrap">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line>
                    </svg>
                </div>
                <div class="reset-info-text" id="resetInfoText">
                    Сервер <span id="resetHsName">matrix.org</span> отправит письмо со ссылкой для сброса пароля.
                </div>
            </div>

            <div class="input-group" id="userGroup">
                <input type="text" id="username" class="input-field" placeholder=" " autocomplete="username" oninput="clearError(this)">
                <label class="input-label" id="lblUsername">Логин или @user:server</label>
                <div class="error-text"></div>
            </div>

            <div class="input-group hidden" id="emailGroup">
                <input type="email" id="email" class="input-field" placeholder=" " autocomplete="email" oninput="clearError(this)">
                <label class="input-label" id="lblEmail">Email</label>
                <div class="error-text"></div>
            </div>

            <div class="input-group">
                <input type="password" id="password" class="input-field has-icon" placeholder=" " autocomplete="current-password" oninput="clearError(this)">
                <label class="input-label" id="lblPassword">Пароль</label>
                <button type="button" class="input-icon-btn" onclick="togglePasswordVisibility('password', this)" tabindex="-1">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24M1 1l22 22"></path>
                    </svg>
                </button>
                <div class="error-text"></div>
            </div>

            <div class="forgot-pass-container" id="forgotLinkWrap">
                <a href="#" class="forgot-pass-link" id="lnkForgot" onclick="setMode('reset'); return false;">Забыли пароль?</a>
            </div>

            <div class="input-group hidden" id="confirmPasswordGroup">
                <input type="password" id="confirmPassword" class="input-field has-icon" placeholder=" " oninput="clearError(this)">
                <label class="input-label" id="lblConfirm">Подтвердите пароль</label>
                <button type="button" class="input-icon-btn" onclick="togglePasswordVisibility('confirmPassword', this)" tabindex="-1">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24M1 1l22 22"></path>
                    </svg>
                </button>
                <div class="error-text"></div>
            </div>

            <div class="actions-wrapper">
                <button type="submit" class="primary-btn" id="primaryBtn">
                    <span class="btn-icon" id="primaryIconWrap"></span>
                    <span id="btnText">ПРОДОЛЖИТЬ</span>
                    <div class="spinner" id="btnSpinner"></div>
                </button>

                <button type="button" class="secondary-btn" id="secondaryBtn" onclick="toggleMainMode()">
                    <span class="btn-icon" id="secondaryIconWrap"></span>
                    <span id="btnSwitchText">СОЗДАТЬ АККАУНТ</span>
                </button>
            </div>
        </form>
    </div>

    <script>
        window.addEventListener('load', () => {
            const preloader = document.getElementById('preloader');
            setTimeout(() => {
                preloader.classList.add('hidden');
                document.body.classList.remove('loading');
            }, 600);
        });

        const languages = [
            { code: 'cy', name: 'Cymraeg' }, { code: 'de', name: 'Deutsch' }, { code: 'en', name: 'English' },
            { code: 'eo', name: 'Esperanto' }, { code: 'id', name: 'Indonesia' }, { code: 'mg', name: 'Malagasy' },
            { code: 'nl', name: 'Nederlands' }, { code: 'vi', name: 'Tiếng Việt' }, { code: 'tr', name: 'Türkçe' },
            { code: 'da', name: 'Dansk' }, { code: 'et', name: 'Eesti' }, { code: 'es', name: 'Español' },
            { code: 'fr', name: 'Français' }, { code: 'gl', name: 'Galego' }, { code: 'hr', name: 'Hrvatski' },
            { code: 'it', name: 'Italiano' }, { code: 'lv', name: 'Latviešu' }, { code: 'lt', name: 'Lietuvių' },
            { code: 'hu', name: 'Magyar' }, { code: 'nb-no', name: 'Norsk bokmål' }, { code: 'pl', name: 'Polski' },
            { code: 'pt', name: 'Português' }, { code: 'pt-br', name: 'Português (Brasil)' }, { code: 'sq', name: 'Shqip' },
            { code: 'sk', name: 'Slovenčina' }, { code: 'fi', name: 'Suomi' }, { code: 'sv', name: 'Svenska' },
            { code: 'is', name: 'Íslenska' }, { code: 'cs', name: 'Čeština' }, { code: 'el', name: 'Ελληνικά' },
            { code: 'ru', name: 'Русский' }, { code: 'uk', name: 'Українська' }, { code: 'hy', name: 'Հայերեն' },
            { code: 'he', name: 'עברית' }, { code: 'fa', name: 'فارسی' }, { code: 'lo', name: 'ລາວ' },
            { code: 'ka', name: 'ქართული' }, { code: 'ja', name: '日本語' }, { code: 'zh-hans', name: '简体中文' },
            { code: 'zh-hant', name: '繁體中文' }, { code: 'ko', name: '한국어' }
        ];

        let currentLangCode = 'ru';

        const i18n = {
            ru: {
                searchPlace: "Поиск языка...", langEmpty: "Язык не найден",
                subLogin: "Укажите свой homeserver и введите данные для входа.",
                subRegister: "Укажите сервер и придумайте данные для нового аккаунта.",
                subReset: "Восстановление доступа к аккаунту.",
                lblHomeserver: "Homeserver (напр. matrix.org)", txtPopularServers: "Популярные серверы",
                lblUsernameLogin: "Логин или @user:server", lblUsernameReg: "Логин",
                lblEmail: "Email", lblPasswordLogin: "Пароль", lblPasswordReg: "Придумайте пароль",
                lblPasswordReset: "Новый пароль", lblConfirm: "Подтвердите пароль",
                lnkForgot: "Забыли пароль?", btnContinue: "ВОЙТИ В АККАУНТ",
                btnRegister: "ЗАРЕГИСТРИРОВАТЬСЯ", btnReset: "СБРОСИТЬ ПАРОЛЬ",
                btnSwitchReg: "СОЗДАТЬ АККАУНТ", btnSwitchLogin: "ВЕРНУТЬСЯ КО ВХОДУ",
                resetInfoHtml: "Сервер <span id='resetHsName'>{hs}</span> отправит письмо со ссылкой для сброса пароля.",
                errRequired: "Обязательное поле", errEmail: "Некорректный email", errPasswordMatch: "Пароли не совпадают"
            },
            en: {
                searchPlace: "Search language...", langEmpty: "Language not found",
                subLogin: "Enter your homeserver and login details.",
                subRegister: "Enter a server and create details for your new account.",
                subReset: "Restore access to your account.",
                lblHomeserver: "Homeserver (e.g. matrix.org)", txtPopularServers: "Popular Servers",
                lblUsernameLogin: "Username or @user:server", lblUsernameReg: "Username",
                lblEmail: "Email", lblPasswordLogin: "Password", lblPasswordReg: "Create Password",
                lblPasswordReset: "New Password", lblConfirm: "Confirm Password",
                lnkForgot: "Forgot Password?", btnContinue: "LOG IN",
                btnRegister: "REGISTER", btnReset: "RESET PASSWORD",
                btnSwitchReg: "CREATE ACCOUNT", btnSwitchLogin: "BACK TO LOGIN",
                resetInfoHtml: "Homeserver <span id='resetHsName'>{hs}</span> will send you an email to reset your password.",
                errRequired: "Required field", errEmail: "Invalid email", errPasswordMatch: "Passwords do not match"
            }
        };

        const btnIcons = {
            login: '<svg viewBox="0 0 24 24"><path d="M11 7L9.6 8.4l2.6 2.6H2v2h10.2l-2.6 2.6L11 17l5-5-5-5zm9 12h-8v2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-8v2h8v14z"/></svg>',
            register: '<svg viewBox="0 0 24 24"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>',
            reset: '<svg viewBox="0 0 24 24"><path d="M12.65 10A5.99 5.99 0 0 0 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6a5.99 5.99 0 0 0 5.65-4H17v4h4v-4h2v-4h-10.35zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>',
            back: '<svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>'
        };

        const langModalOverlay = document.getElementById('langModalOverlay');
        const langListEl = document.getElementById('langList');
        const langSearchInput = document.getElementById('langSearch');
        const currentLangBtnText = document.getElementById('currentLangBtnText');

        function renderLanguages(filterText = '') {
            langListEl.innerHTML = '';
            const filtered = languages.filter(l => l.name.toLowerCase().includes(filterText.toLowerCase()));
            if (filtered.length === 0) {
                const dict = i18n[i18n[currentLangCode] ? currentLangCode : 'en'];
                langListEl.innerHTML = `<div class="lang-empty">${dict.langEmpty}</div>`;
                return;
            }
            filtered.forEach(lang => {
                const div = document.createElement('div');
                div.className = `lang-item ${lang.code === currentLangCode ? 'selected' : ''}`;
                if (lang.code === currentLangCode) {
                    div.innerHTML = `<span>${lang.name}</span><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
                } else { div.textContent = lang.name; }
                div.onclick = () => selectLanguage(lang.code, lang.name);
                langListEl.appendChild(div);
            });
        }

        function filterLanguages() { renderLanguages(langSearchInput.value); }
        function scrollToSelectedLanguage() {
            const selectedEl = langListEl.querySelector('.lang-item.selected');
            if (!selectedEl) return;
            const targetScrollTop = selectedEl.offsetTop - (langListEl.clientHeight / 2) + (selectedEl.offsetHeight / 2);
            langListEl.scrollTop = Math.max(0, targetScrollTop);
        }

        function openLangModal() {
            if (langModalOverlay.classList.contains('active')) { closeLangModalBtn(); return; }
            langSearchInput.value = '';
            renderLanguages();
            langListEl.scrollTop = 0;
            langModalOverlay.classList.add('active');
            requestAnimationFrame(() => { scrollToSelectedLanguage(); langSearchInput.focus(); });
        }

        function closeLangModalBtn() { langModalOverlay.classList.remove('active'); }

        function closeLangModalMobile(e) {
            if (window.innerWidth <= 1125 && e.target === langModalOverlay) { closeLangModalBtn(); }
        }

        document.addEventListener('click', (e) => {
            const langModal = document.getElementById('langModal');
            const langToggle = document.querySelector('.lang-toggle');
            if (langModalOverlay.classList.contains('active')) {
                if (!langModal.contains(e.target) && !langToggle.contains(e.target)) {
                    if (window.innerWidth > 1125) { closeLangModalBtn(); }
                }
            }
        });

        function selectLanguage(code, name) {
            currentLangCode = code;
            currentLangBtnText.textContent = name;
            closeLangModalBtn();
            updateUI();
            document.querySelectorAll('.input-group.invalid').forEach(el => el.classList.remove('invalid'));
        }

        let currentMode = 'login';

        function updateUI() {
            const text = i18n[i18n[currentLangCode] ? currentLangCode : 'en'];
            document.getElementById('lblSearchPlace').textContent = text.searchPlace;
            document.getElementById('lblHomeserver').textContent = text.lblHomeserver;
            document.getElementById('txtPopularServers').textContent = text.txtPopularServers;
            document.getElementById('lblEmail').textContent = text.lblEmail;
            document.getElementById('lblConfirm').textContent = text.lblConfirm;
            document.getElementById('lnkForgot').textContent = text.lnkForgot;

            let hsVal = document.getElementById('homeserver').value.trim() || (currentLangCode === 'ru' ? 'ваш сервер' : 'your server');
            document.getElementById('resetInfoText').innerHTML = text.resetInfoHtml.replace('{hs}', hsVal);

            const activeLangObj = languages.find(l => l.code === currentLangCode) || languages[30];
            currentLangBtnText.textContent = activeLangObj.name;

            setMode(currentMode, true); // Пропуск анимации при обновлении языка
        }

        function toggleMainMode() {
            document.querySelectorAll('.input-group.invalid').forEach(el => el.classList.remove('invalid'));
            if (currentMode === 'reset' || currentMode === 'register') setMode('login');
            else setMode('register');
        }

        function applyModeChanges(mode) {
            currentMode = mode;
            const text = i18n[i18n[currentLangCode] ? currentLangCode : 'en'];

            const userGroup = document.getElementById('userGroup');
            const emailGroup = document.getElementById('emailGroup');
            const confirmPasswordGroup = document.getElementById('confirmPasswordGroup');
            const resetInfoBox = document.getElementById('resetInfoBox');
            const forgotLinkWrap = document.getElementById('forgotLinkWrap');
            const passwordInput = document.getElementById('password');
            const primaryIconWrap = document.getElementById('primaryIconWrap');
            const secondaryIconWrap = document.getElementById('secondaryIconWrap');

            userGroup.classList.remove('hidden');
            emailGroup.classList.add('hidden');
            confirmPasswordGroup.classList.add('hidden');
            resetInfoBox.classList.add('hidden');
            forgotLinkWrap.classList.add('hidden');

            if (mode === 'login') {
                forgotLinkWrap.classList.remove('hidden');
                document.getElementById('lblUsername').textContent = text.lblUsernameLogin;
                document.getElementById('lblPassword').textContent = text.lblPasswordLogin;
                passwordInput.setAttribute('autocomplete', 'current-password');
                document.getElementById('headerSubtitle').textContent = text.subLogin;
                document.getElementById('btnText').textContent = text.btnContinue;
                document.getElementById('btnSwitchText').textContent = text.btnSwitchReg;
                primaryIconWrap.innerHTML = btnIcons.login;
                secondaryIconWrap.innerHTML = btnIcons.register;
            }
            else if (mode === 'register') {
                emailGroup.classList.remove('hidden');
                confirmPasswordGroup.classList.remove('hidden');
                document.getElementById('lblUsername').textContent = text.lblUsernameReg;
                document.getElementById('lblPassword').textContent = text.lblPasswordReg;
                passwordInput.setAttribute('autocomplete', 'new-password');
                document.getElementById('headerSubtitle').textContent = text.subRegister;
                document.getElementById('btnText').textContent = text.btnRegister;
                document.getElementById('btnSwitchText').textContent = text.btnSwitchLogin;
                primaryIconWrap.innerHTML = btnIcons.register;
                secondaryIconWrap.innerHTML = btnIcons.back;
            }
            else if (mode === 'reset') {
                userGroup.classList.add('hidden');
                resetInfoBox.classList.remove('hidden');
                emailGroup.classList.remove('hidden');
                confirmPasswordGroup.classList.remove('hidden');
                document.getElementById('lblPassword').textContent = text.lblPasswordReset;
                passwordInput.setAttribute('autocomplete', 'new-password');
                document.getElementById('headerSubtitle').textContent = text.subReset;
                document.getElementById('btnText').textContent = text.btnReset;
                document.getElementById('btnSwitchText').textContent = text.btnSwitchLogin;
                primaryIconWrap.innerHTML = btnIcons.reset;
                secondaryIconWrap.innerHTML = btnIcons.back;
            }
        }

        // --- ПЛАВНАЯ АНИМАЦИЯ ПЕРЕКЛЮЧЕНИЯ РЕЖИМОВ ---
        function setMode(mode, skipAnimation = false) {
            if (currentMode === mode && !skipAnimation) return;
            if (skipAnimation) { applyModeChanges(mode); return; }

            const formEl = document.getElementById('authForm');
            const subtitle = document.getElementById('headerSubtitle');

            // 1. Анимация ухода вправо
            formEl.style.transition = 'opacity 0.15s var(--ios-ease), transform 0.15s var(--ios-ease)';
            subtitle.style.transition = 'opacity 0.15s var(--ios-ease), transform 0.15s var(--ios-ease)';
            formEl.style.opacity = '0';
            formEl.style.transform = 'translateX(15px)';
            subtitle.style.opacity = '0';
            subtitle.style.transform = 'translateX(15px)';

            setTimeout(() => {
                // Изменение структуры
                applyModeChanges(mode);

                // 2. Перенос влево без анимации
                formEl.style.transition = 'none';
                subtitle.style.transition = 'none';
                formEl.style.transform = 'translateX(-15px)';
                subtitle.style.transform = 'translateX(-15px)';

                void formEl.offsetWidth; // Reflow (перерисовка)

                // 3. Выезд слева направо в центр
                formEl.style.transition = 'opacity 0.25s var(--ios-ease), transform 0.25s var(--ios-ease)';
                subtitle.style.transition = 'opacity 0.25s var(--ios-ease), transform 0.25s var(--ios-ease)';
                formEl.style.opacity = '1';
                formEl.style.transform = 'translateX(0)';
                subtitle.style.opacity = '1';
                subtitle.style.transform = 'translateX(0)';
            }, 150);
        }

        function clearError(input) {
            const group = input.closest('.input-group');
            if (group) group.classList.remove('invalid');
        }

        function checkField(id, condition, msgKey) {
            const el = document.getElementById(id);
            const group = el.closest('.input-group');
            const errText = group.querySelector('.error-text');
            const text = i18n[i18n[currentLangCode] ? currentLangCode : 'en'];

            if (!condition) {
                group.classList.remove('invalid');
                void group.offsetWidth;
                group.classList.add('invalid');
                errText.textContent = text[msgKey];
                return false;
            }
            return true;
        }

        const hsGroup = document.getElementById('hsGroup');
        const homeserverInput = document.getElementById('homeserver');

        function openDropdown() { hsGroup.classList.add('open'); }
        function closeDropdown() { hsGroup.classList.remove('open'); }

        function toggleDropdown(e) {
            e.stopPropagation();
            if (hsGroup.classList.contains('open')) closeDropdown();
            else { openDropdown(); homeserverInput.focus(); }
        }

        function handleInput(input) {
            clearError(input);
            openDropdown();
            updateResetText();
        }

        function selectServer(server) {
            homeserverInput.value = server;
            clearError(homeserverInput);
            closeDropdown();
            updateResetText();
            if(currentMode !== 'reset') document.getElementById('username').focus();
        }

        document.addEventListener('click', (e) => {
            if (!hsGroup.contains(e.target)) closeDropdown();
        });

        function updateResetText() {
            const span = document.getElementById('resetHsName');
            if (span) { span.textContent = homeserverInput.value.trim() || (currentLangCode === 'ru' ? 'ваш сервер' : 'your server'); }
        }

        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.innerHTML = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
            } else {
                input.type = 'password';
                btn.innerHTML = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24M1 1l22 22"></path></svg>`;
            }
        }

        function handleAuth(e) {
            e.preventDefault();
            let isValid = true;
            let hs = homeserverInput.value.trim();
            if (!checkField('homeserver', hs.length > 0, 'errRequired')) isValid = false;

            if (currentMode !== 'reset') {
                const userVal = document.getElementById('username').value.trim();
                if (!checkField('username', userVal.length > 0, 'errRequired')) isValid = false;
            }

            if (currentMode !== 'login') {
                const emailVal = document.getElementById('email').value.trim();
                const isEmailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailVal);
                if (emailVal.length === 0) {
                    if (!checkField('email', false, 'errRequired')) isValid = false;
                } else if (!checkField('email', isEmailValid, 'errEmail')) {
                    isValid = false;
                }
            }

            const passwordInput = document.getElementById('password');
            const confirmPasswordInput = document.getElementById('confirmPassword');

            if (currentMode === 'login') {
                if (!checkField('password', passwordInput.value.length > 0, 'errRequired')) isValid = false;
            } else {
                const pValid = checkField('password', passwordInput.value.length > 0, 'errRequired');
                if (!pValid) isValid = false;
                if (pValid) {
                    if (confirmPasswordInput.value.length === 0) {
                        if (!checkField('confirmPassword', false, 'errRequired')) isValid = false;
                    } else if (!checkField('confirmPassword', passwordInput.value === confirmPasswordInput.value, 'errPasswordMatch')) {
                        isValid = false;
                    }
                }
            }

            if (!isValid) return;
            if (!hs.startsWith('http')) { hs = 'https://' + hs; }

            const primaryBtn = document.getElementById('primaryBtn');
            const secondaryBtn = document.getElementById('secondaryBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const primaryIconWrap = document.getElementById('primaryIconWrap');

            btnText.style.display = 'none';
            primaryIconWrap.style.display = 'none';
            btnSpinner.style.display = 'block';
            primaryBtn.style.pointerEvents = 'none';
            secondaryBtn.style.pointerEvents = 'none';

            const authData = {
                action: currentMode,
                homeserver: hs,
                username: currentMode !== 'reset' ? document.getElementById('username').value : undefined,
                email: currentMode !== 'login' ? document.getElementById('email').value : undefined,
                password: passwordInput.value
            };

            console.log('e2e.network | Auth Event:', authData);

            setTimeout(() => {
                btnText.style.display = 'block';
                primaryIconWrap.style.display = 'flex';
                btnSpinner.style.display = 'none';
                primaryBtn.style.pointerEvents = 'auto';
                secondaryBtn.style.pointerEvents = 'auto';
            }, 1200);
        }

        function refreshAutofillStyles() {
            const rootStyles = getComputedStyle(document.documentElement);
            const textColor = rootStyles.getPropertyValue('--text-main').trim() || '#ffffff';
            const bgColor = rootStyles.getPropertyValue('--bg-base').trim() || '#0b0b0d';
            const fontFamily = rootStyles.getPropertyValue('--font-family').trim() || 'Manrope, sans-serif';

            document.querySelectorAll('.input-field:not(.search-field)').forEach(input => {
                input.style.color = textColor;
                input.style.webkitTextFillColor = textColor;
                input.style.textShadow = `0 0 0 ${textColor}`;
                input.style.fontFamily = fontFamily;
                input.style.backgroundColor = bgColor;
                input.style.backgroundImage = 'none';
            });
        }

        window.addEventListener('load', () => { refreshAutofillStyles(); setTimeout(refreshAutofillStyles, 0); setTimeout(refreshAutofillStyles, 120); setTimeout(refreshAutofillStyles, 300); });
        window.addEventListener('pageshow', () => { refreshAutofillStyles(); setTimeout(refreshAutofillStyles, 0); setTimeout(refreshAutofillStyles, 120); setTimeout(refreshAutofillStyles, 300); });
        document.addEventListener('focusin', (e) => { if (e.target.classList && e.target.classList.contains('input-field')) refreshAutofillStyles(); });
        document.addEventListener('input', (e) => { if (e.target.classList && e.target.classList.contains('input-field')) refreshAutofillStyles(); });
        document.addEventListener('change', (e) => { if (e.target.classList && e.target.classList.contains('input-field')) refreshAutofillStyles(); });

        updateUI();
        refreshAutofillStyles();
    </script>
</body>
